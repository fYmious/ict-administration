services:
  mongo1:
    image: mongo:8.0
    container_name: mongo1
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo1_data:/data/db
    networks:
      - lab-net

  mongo2:
    image: mongo:8.0
    container_name: mongo2
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - mongo2_data:/data/db
    networks:
      - lab-net

  mongo3:
    image: mongo:8.0
    container_name: mongo3
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27019:27017"
    volumes:
      - mongo3_data:/data/db
    networks:
      - lab-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notes-app
    ports:
      - "8080:8080"
    environment:
      MONGO_REPLICA_URI: "mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0&readConcernLevel=majority&serverSelectionTimeoutMS=5000"
      READ_PREFERENCE: "primary"
    depends_on:
      - mongo1
      - mongo2
      - mongo3
    networks:
      - lab-net

  mongo-exporter:
    image: percona/mongodb_exporter:0.40
    container_name: mongo-exporter
    command:
      - "--mongodb.uri=mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0"
      - "--collect-all"
      - "--compatible-mode"
    ports:
      - "9216:9216"
    depends_on:
      - mongo1
      - mongo2
      - mongo3
    networks:
      - lab-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    networks:
      - lab-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - lab-net

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:

networks:
  lab-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.250.0.0/24


