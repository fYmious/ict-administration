services:
  picker-service:
    build: ./pickerService/.
    ports:
      - "8081:8080"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=orders
      - KAFKA_GROUP_ID=picker-group
      - INSTANCE_NAME=picker-1

  user-service:
    build: ./userService/.
    ports:
      - "8082:8080"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=orders

  # picker-service-2:
  #   build: ./pickerService/.
  #   ports:
  #     - "8083:8080"
  #   environment:
  #     - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
