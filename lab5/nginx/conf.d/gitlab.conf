map $request_method $login_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $login_key zone=login:10m rate=5r/m;
limit_req_status 429;

geo $admin_allowed {
    default      0;
    127.0.0.1    1;
    172.30.0.1   1;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name gitlab.local registry.gitlab.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name gitlab.local;

    ssl_certificate     /etc/nginx/certs/gitlab.local.crt;
    ssl_certificate_key /etc/nginx/certs/gitlab.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 512m;

    location ~ ^/admin(/|$) {
        if ($admin_allowed = 0) { return 403; }
        include /etc/nginx/conf.d/proxy.inc;
        proxy_pass http://gitlab:80;
    }

    location = /users/sign_in {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/conf.d/proxy.inc;
        proxy_pass http://gitlab:80;
    }

    location ~ ^/-/(metrics|readiness|liveness) {
        return 404;
    }

    location / {
        include /etc/nginx/conf.d/proxy.inc;
        proxy_pass http://gitlab:80;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name registry.gitlab.local;

    ssl_certificate     /etc/nginx/certs/gitlab.local.crt;
    ssl_certificate_key /etc/nginx/certs/gitlab.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 0;
    proxy_request_buffering off;

    location / {
        include /etc/nginx/conf.d/proxy.inc;
        proxy_pass http://gitlab:5050;
    }
}
